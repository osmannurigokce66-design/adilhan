<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adilhan Otomotiv</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f59e0b;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: var(--bg-main);
            border-color: var(--text-light);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .welcome-banner {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 2.5rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }

        .welcome-banner h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .welcome-banner p {
            opacity: 0.9;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 3rem;
        }

        .car-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .car-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #e2e8f0;
        }

        .car-body {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .car-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .car-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .car-details {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            display: flex;
            gap: 15px;
        }

        .car-details span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chat-admin-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-top: 2rem;
            box-shadow: var(--shadow);
        }

        .chat-admin-card {
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .chat-admin-card h4 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .chat-admin-card p {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-car-side"></i> Adilhan Otomotiv
        </div>
        <div class="user-actions">
            <button class="btn btn-outline" onclick="loadMyQuestions()"><i class="fa-solid fa-comments"></i> Sorularım</button>
        </div>
    </header>

    <main>
        <div class="welcome-banner">
            <h1>Hayalinizdeki Araca Ulaşın</h1>
            <p>Geniş araç portföyümüzü inceleyin, sorularınızı iletin ve güvenle sahiplenin.</p>
        </div>

        <section>
            <h2 class="section-title"><i class="fa-solid fa-car"></i> Vitrindeki Araçlar</h2>
            <div class="car-grid" id="carGrid">
                <!-- Araçlar JavaScript ile yüklenecek -->
            </div>
        </section>

        <section class="chat-admin-container">
            <h2 class="section-title" style="font-size: 1.25rem; margin-bottom: 1rem;"><i class="fa-solid fa-clipboard-question"></i> Soru Geçmişim</h2>
            <div id="myQuestionsContainer">
                <p style="color:var(--text-light); font-size:0.9rem;">Henüz sorduğunuz bir soru bulunmuyor.</p>
            </div>
        </section>
    </main>

    <script>
        // Örnek veri ve fonksiyonlar (Gerekli temel yapı)
        const myMsgs = [];

        function loadMyQuestions() {
            const container = document.getElementById('myQuestionsContainer');
            container.innerHTML = '';

            if (myMsgs.length === 0) {
                container.innerHTML = '<p style="color:var(--text-light); font-size:0.9rem;">Henüz sorduğunuz bir soru bulunmuyor.</p>';
                return;
            }

            myMsgs.forEach(m => {
                const card = document.createElement('div');
                card.className = 'chat-admin-card';
                card.innerHTML = `
                    <h4><span><i class="fa-solid fa-car"></i> ${m.carTitle}</span> <span style="font-size:0.8rem; color:var(--text-light);">${m.date}</span></h4>
                    <p><strong>Sizin Sorunuz:</strong> ${m.question}</p>
                    <div style="font-size: 0.9rem; color: var(--primary); background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid var(--border);">
                        <strong>Adilhan Otomotiv Yanıtı:</strong> ${m.answer ? m.answer : '<span style="color:#d97706; font-style:italic;">Yönetici yanıtı bekleniyor...</span>'}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
